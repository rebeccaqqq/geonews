name: investment-agent tests

on:
  push:
    branches: [main]
    paths:
      - "investment-agent/**"
      - ".github/workflows/investment-agent-tests.yml"
  pull_request:
    paths:
      - "investment-agent/**"
      - ".github/workflows/investment-agent-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: investment-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: investment-agent/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
